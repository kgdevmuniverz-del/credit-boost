name: keep-alive
# Pings the free Render service so it doesn't spin down after 15 idle minutes.
# GitHub cron is best-effort (can run late or skip under load) and is disabled after 60 days without repo activity.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://credit-boost.onrender.com/healthz) && [ "$code" = 200 ] && { echo "ok ($code)"; exit 0; }
            echo "attempt $i: $code"; sleep 10
          done
          exit 1
